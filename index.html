<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#0a0a0c" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta property="og:title" content="Viwed" />
<meta property="og:description" content="You have a new message" />
<meta property="og:type" content="website" />
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🪐</text></svg>">
<title>View once</title>
<style>
  :root {
    --wa-bg: #0b141a;
    --wa-header: #1f2c33;
    --wa-text: #e9edef;
    --wa-text-dim: #8696a0;
    --wa-green: #00a884;
    --wa-gold: #f0d99b;
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    background: var(--wa-bg);
    color: var(--wa-text);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    overflow: hidden;
    -webkit-tap-highlight-color: transparent;
    -webkit-text-size-adjust: 100%;
    overscroll-behavior: none;
    touch-action: manipulation;
  }

  /* WhatsApp wallpaper */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
    background:
      radial-gradient(circle at 20% 30%, rgba(0,168,132,.04), transparent 40%),
      radial-gradient(circle at 80% 70%, rgba(0,168,132,.03), transparent 40%),
      repeating-linear-gradient(45deg, rgba(255,255,255,.008) 0 2px, transparent 2px 22px),
      repeating-linear-gradient(-45deg, rgba(255,255,255,.008) 0 2px, transparent 2px 22px);
  }

  .screen {
    position: relative;
    z-index: 1;
    height: 100%;
    display: flex;
    flex-direction: column;
  }

  /* ================= TOP BAR ================= */
  .topbar {
    background: var(--wa-header);
    padding: calc(10px + var(--safe-top)) 14px 10px;
    display: flex;
    align-items: center;
    gap: 12px;
    box-shadow: 0 1px 3px rgba(0,0,0,.5);
    flex-shrink: 0;
  }

  .back {
    width: 22px;
    height: 22px;
    stroke: var(--wa-text);
    stroke-width: 2;
    fill: none;
    flex-shrink: 0;
  }

  .avatar {
    width: 38px;
    height: 38px;
    border-radius: 50%;
    background: linear-gradient(135deg, #e63946, #7a141c);
    display: grid;
    place-items: center;
    font-size: 18px;
    flex-shrink: 0;
    box-shadow: inset 0 -2px 6px rgba(0,0,0,.4);
  }

  .contact { flex: 1; min-width: 0; }
  .contact .name {
    font-size: 16px;
    font-weight: 500;
    color: var(--wa-text);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .contact .status {
    font-size: 12px;
    color: var(--wa-text-dim);
    margin-top: 1px;
  }

  .topbar-icons {
    display: flex;
    gap: 20px;
    align-items: center;
    flex-shrink: 0;
  }
  .topbar-icons svg {
    width: 20px;
    height: 20px;
    stroke: var(--wa-text);
    fill: none;
    stroke-width: 1.8;
  }

  /* ================= MAIN AREA ================= */
  .chat {
    flex: 1;
    overflow: hidden;
    padding: 12px 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    text-align: center;
  }

  /* ---- Saturn ---- */
  .saturn-hero {
    width: 112px;
    height: 112px;
    overflow: visible;
    animation:
      saturnIn 0.9s cubic-bezier(.22,.61,.36,1) 0.1s both,
      saturnFloat 5.5s ease-in-out 1s infinite;
    filter:
      drop-shadow(0 8px 12px rgba(230,57,70,.35))
      drop-shadow(0 0 22px rgba(230,57,70,.22));
  }

  .saturn-hero .ring-spin {
    transform-origin: 80px 80px;
    animation: ringSpin3D 13s linear infinite;
  }
  .saturn-hero .ring-back  { animation-duration: 15s; }
  .saturn-hero .ring-front { animation-duration: 11s; }

  .sat-moon-orbit {
    transform-origin: 80px 80px;
    animation: moonOrbit 5s linear infinite;
  }

  @keyframes saturnIn {
    from { opacity: 0; transform: translateY(-20px) scale(0.7); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }
  @keyframes saturnFloat {
    0%, 100% { transform: translateY(0) rotate(-2deg); }
    50%      { transform: translateY(-6px) rotate(2deg); }
  }
  @keyframes ringSpin3D {
    0%   { transform: rotate(0deg) scaleY(.86); }
    50%  { transform: rotate(180deg) scaleY(1); }
    100% { transform: rotate(360deg) scaleY(.86); }
  }
  @keyframes moonOrbit {
    from { transform: rotate(0deg) translateX(48px) rotate(0deg); }
    to   { transform: rotate(360deg) translateX(48px) rotate(-360deg); }
  }

  @media (max-width: 500px) {
    .saturn-hero { width: 96px; height: 96px; }
  }

  /* ---- Big message ---- */
  .big-message {
    font-family: Georgia, 'Times New Roman', serif;
    font-size: clamp(20px, 6vw, 28px);
    line-height: 1.35;
    color: var(--wa-text);
    letter-spacing: .01em;
    max-width: 340px;
    opacity: 0;
    transform: translateY(14px);
    animation: messageIn 1.1s cubic-bezier(.22,.61,.36,1) 0.6s forwards;
  }

  .big-message .accent {
    color: var(--wa-gold);
    font-style: italic;
    display: block;
    margin-top: 4px;
  }

  @keyframes messageIn {
    to { opacity: 1; transform: translateY(0); }
  }

  /* ================= CONSTELLATION ================= */
  .constellation-wrap {
    width: 100%;
    max-width: 340px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
  }

  .constellation-svg {
    width: 100%;
    height: auto;
    overflow: visible;
  }

  .c-line {
    stroke: rgba(240, 217, 155, 0.55);
    stroke-width: 1;
    stroke-linecap: round;
    filter: drop-shadow(0 0 3px rgba(240, 217, 155, 0.55));
    stroke-dasharray: var(--len);
    stroke-dashoffset: var(--len);
    animation: drawLine 0.45s ease-out forwards;
    opacity: 0;
  }
  @keyframes drawLine {
    0%   { opacity: 1; stroke-dashoffset: var(--len); }
    100% { opacity: 1; stroke-dashoffset: 0; }
  }

  .c-star {
    fill: #fff;
    filter: drop-shadow(0 0 4px #fff) drop-shadow(0 0 9px rgba(240, 217, 155, 0.8));
    opacity: 0;
    transform-origin: center;
    transform-box: fill-box;
    animation: popStar 0.55s cubic-bezier(.34,1.56,.64,1) forwards;
  }
  @keyframes popStar {
    0%   { opacity: 0; transform: scale(0.3); }
    100% { opacity: 1; transform: scale(1); }
  }

  .c-label {
    font-family: Georgia, serif;
    font-style: italic;
    font-size: 10px;
    fill: rgba(240, 217, 155, 0.95);
    text-anchor: middle;
    opacity: 0;
    animation: fadeLabel 0.5s ease-out forwards;
  }
  @keyframes fadeLabel { to { opacity: 1; } }

  /* ---- Name under the constellation ---- */
  .name-line {
    font-family: Georgia, serif;
    font-style: italic;
    font-size: 15px;
    color: var(--wa-gold);
    letter-spacing: 0.08em;
    opacity: 0;
    transform: translateY(6px);
    animation: nameIn 0.9s cubic-bezier(.22,.61,.36,1) forwards;
  }
  .name-line::before,
  .name-line::after {
    content: '·';
    margin: 0 10px;
    color: rgba(240, 217, 155, 0.5);
    font-style: normal;
  }
  @keyframes nameIn {
    to { opacity: 1; transform: translateY(0); }
  }

  /* ---- Footnote ---- */
  .footnote {
    font-family: Georgia, serif;
    font-style: italic;
    font-size: 12.5px;
    color: var(--wa-text-dim);
    letter-spacing: 0.02em;
    opacity: 0;
    transform: translateY(6px);
    animation: footnoteIn 0.9s cubic-bezier(.22,.61,.36,1) forwards;
  }
  .footnote .from {
    font-style: normal;
    color: var(--wa-gold);
    font-weight: 500;
    letter-spacing: 0.05em;
  }
  @keyframes footnoteIn {
    to { opacity: 1; transform: translateY(0); }
  }

  /* ================= INPUT BAR ================= */
  .inputbar {
    background: var(--wa-header);
    padding: 8px 10px calc(8px + var(--safe-bottom));
    display: flex;
    align-items: center;
    gap: 8px;
    flex-shrink: 0;
  }
  .inputbar .field {
    flex: 1;
    background: #2a3942;
    border-radius: 22px;
    padding: 10px 16px;
    font-size: 15px;
    color: var(--wa-text-dim);
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .inputbar .field svg {
    width: 18px;
    height: 18px;
    stroke: var(--wa-text-dim);
    fill: none;
    stroke-width: 1.8;
    flex-shrink: 0;
  }
  .inputbar .mic {
    width: 42px;
    height: 42px;
    border-radius: 50%;
    background: var(--wa-green);
    display: grid;
    place-items: center;
    flex-shrink: 0;
  }
  .inputbar .mic svg {
    width: 20px;
    height: 20px;
    stroke: #0b141a;
    fill: none;
    stroke-width: 2;
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.01ms !important;
      opacity: 1 !important;
    }
  }
</style>
</head>
<body>

<div class="screen">


  <!-- ============ MAIN ============ -->
  <div class="chat">

    <!-- Saturn -->
    <svg class="saturn-hero" viewBox="0 0 160 160" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <defs>
        <radialGradient id="planetGrad" cx="35%" cy="28%">
          <stop offset="0%"  stop-color="#ffd0a8"/>
          <stop offset="28%" stop-color="#ff8a8a"/>
          <stop offset="62%" stop-color="#e63946"/>
          <stop offset="100%" stop-color="#661019"/>
        </radialGradient>
        <linearGradient id="ringGrad" x1="0" x2="1">
          <stop offset="0%" stop-color="#7a141c" stop-opacity=".15"/>
          <stop offset="22%" stop-color="#f0d99b" stop-opacity=".8"/>
          <stop offset="48%" stop-color="#ff6b6b" stop-opacity=".55"/>
          <stop offset="72%" stop-color="#f0d99b" stop-opacity=".85"/>
          <stop offset="100%" stop-color="#7a141c" stop-opacity=".15"/>
        </linearGradient>
        <clipPath id="planetClip">
          <circle cx="80" cy="80" r="29"/>
        </clipPath>
        <filter id="satGlow">
          <feGaussianBlur stdDeviation="3" result="blur"/>
          <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
      </defs>

      <circle cx="80" cy="80" r="48" fill="#e63946" opacity=".08" filter="url(#satGlow)"/>

      <g class="ring-back ring-spin">
        <ellipse cx="80" cy="80" rx="69" ry="21" fill="none" stroke="url(#ringGrad)" stroke-width="7" opacity=".8"/>
        <ellipse cx="80" cy="80" rx="57" ry="17" fill="none" stroke="#f0d99b" stroke-width="1.4" opacity=".45"/>
      </g>

      <circle cx="80" cy="80" r="29" fill="url(#planetGrad)"/>
      <g clip-path="url(#planetClip)" opacity=".42">
        <path d="M45 64 Q80 57 115 65" fill="none" stroke="#ffd5b0" stroke-width="4"/>
        <path d="M44 73 Q80 67 116 75" fill="none" stroke="#8f1822" stroke-width="5"/>
        <path d="M43 86 Q80 92 117 84" fill="none" stroke="#ffb08d" stroke-width="3"/>
        <path d="M47 97 Q80 103 113 94" fill="none" stroke="#7a141c" stroke-width="4"/>
      </g>
      <ellipse cx="70" cy="66" rx="12" ry="7" fill="#fff1d6" opacity=".13"/>

      <g class="ring-front ring-spin">
        <path d="M11 80 A69 21 0 0 0 149 80" fill="none" stroke="url(#ringGrad)" stroke-width="7" opacity=".9"/>
        <path d="M22 80 A57 17 0 0 0 138 80" fill="none" stroke="#f0d99b" stroke-width="1.5" opacity=".6"/>
        <circle cx="143" cy="78" r="2.2" fill="#f0d99b"/>
      </g>

      <g class="sat-moon-orbit">
        <circle cx="132" cy="45" r="3" fill="#f0d99b"/>
        <circle cx="132" cy="45" r="1" fill="#fff"/>
      </g>
    </svg>

    <!-- Big message -->
    <div class="big-message">
      Hope you enjoyed it,
      <span class="accent">until next time</span>
    </div>

    <!-- Constellation (SHANDRÉ) + name below -->
    <div class="constellation-wrap">
      <svg class="constellation-svg" id="constellationSvg"
           viewBox="0 0 360 60" preserveAspectRatio="xMidYMid meet" aria-hidden="true"></svg>
      <div class="name-line" id="nameLine">Shandré</div>
    </div>

    <!-- Footnote -->
    <div class="footnote" id="footnote">
      — from <span class="from">Hadley</span>
    </div>

  </div>

  <!-- ============ INPUT BAR ============ -->
  <div class="inputbar">
    <div class="field">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M8 14s1.5 2 4 2 4-2 4-2M9 9h.01M15 9h.01" stroke-linecap="round"/></svg>
      <span>Message</span>
    </div>
    <div class="mic">
      <svg viewBox="0 0 24 24"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3zM19 10v2a7 7 0 0 1-14 0v-2M12 19v4M8 23h8" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </div>
  </div>

</div>

<script>
  /* ==================================================================
     CONFIG
     ================================================================== */
  const CONSTELLATION_TEXT = 'SHANDRÉ';  // what the constellation spells
  const DISPLAY_NAME       = 'Shandré';  // name shown below the constellation
  const FOOTNOTE_FROM      = 'Hadley';   // footnote signature

  /* ---------- Constellation ---------- */
  (function buildConstellation() {
    const svg = document.getElementById('constellationSvg');
    const W = 360, H = 60;
    const NS = 'http://www.w3.org/2000/svg';

    const chars = CONSTELLATION_TEXT.replace(/\s+/g, '').toUpperCase().slice(0, 12).split('');
    if (chars.length < 2) return;

    const n = chars.length;
    const margin = 26;
    const usableW = W - margin * 2;

    const nodes = [];
    for (let i = 0; i < n; i++) {
      const t = n === 1 ? 0.5 : i / (n - 1);
      const x = margin + usableW * t;
      // Gentle wave so it feels like a real constellation
      const wave = Math.sin(i * 1.25) * 10 + Math.cos(i * 0.7) * 4;
      const y = H / 2 + wave;
      nodes.push({ x, y, letter: chars[i] });
    }

    // Timing — starts after Saturn + big message appear
    const BASE_DELAY   = 1.7;
    const STEP         = 0.22;   // tighter for 7 letters
    const NAME_DELAY   = BASE_DELAY + (nodes.length - 1) * STEP + 0.6;
    const FOOTNOTE_DELAY = NAME_DELAY + 0.6;

    // Connector lines
    for (let i = 0; i < nodes.length - 1; i++) {
      const a = nodes[i], b = nodes[i + 1];
      const len = Math.hypot(b.x - a.x, b.y - a.y);

      const line = document.createElementNS(NS, 'line');
      line.setAttribute('x1', a.x); line.setAttribute('y1', a.y);
      line.setAttribute('x2', b.x); line.setAttribute('y2', b.y);
      line.setAttribute('class', 'c-line');
      line.style.setProperty('--len', len);
      line.style.animationDelay = (BASE_DELAY + i * STEP) + 's';
      svg.appendChild(line);
    }

    // Stars + labels
    nodes.forEach((n, i) => {
      const star = document.createElementNS(NS, 'circle');
      star.setAttribute('cx', n.x);
      star.setAttribute('cy', n.y);
      star.setAttribute('r', 2.8);
      star.setAttribute('class', 'c-star');
      star.style.animationDelay = (BASE_DELAY + i * STEP) + 's';
      star.style.transformOrigin = `${n.x}px ${n.y}px`;
      svg.appendChild(star);

      if (n.letter) {
        const label = document.createElementNS(NS, 'text');
        label.setAttribute('x', n.x);
        label.setAttribute('y', n.y - 10);
        label.setAttribute('class', 'c-label');
        label.textContent = n.letter;
        label.style.animationDelay = (BASE_DELAY + i * STEP + 0.08) + 's';
        svg.appendChild(label);
      }
    });

    // Name under constellation
    const nameEl = document.getElementById('nameLine');
    nameEl.textContent = DISPLAY_NAME;
    nameEl.style.animationDelay = NAME_DELAY + 's';

    // Footnote
    const footEl = document.getElementById('footnote');
    footEl.innerHTML = `— from <span class="from">${FOOTNOTE_FROM}</span>`;
    footEl.style.animationDelay = FOOTNOTE_DELAY + 's';
  })();
</script>

</body>
</html>
